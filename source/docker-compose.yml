services:
  # Broker Req-Rep (ROUTER 5555 para os clientes, DEALER 5556 para os servidores)
  broker:
    build:
      context: ./cpp
      dockerfile: Dockerfile
    command: ["./build/broker"]
    restart: unless-stopped
    networks:
      - rede-projeto

  # Proxy Pub/Sub (XSUB 5557 para os servidores, XPUB 5558 para os clientes)
  proxy-pubsub:
    build:
      context: ./javascript
      dockerfile: Dockerfile
    command: ["node", "proxy_pubsub.js"]
    restart: unless-stopped
    networks:
      - rede-projeto

  # Serviço de referência (rank, lista de servidores, heartbeat e hora correta)
  referencia:
    build:
      context: ./cpp
      dockerfile: Dockerfile
    command: ["./build/referencia"]
    restart: unless-stopped
    networks:
      - rede-projeto

  server-python-1:
    build:
      context: ./python
      dockerfile: Dockerfile
    command: ["python", "server.py"]
    environment:
      BROKER_BACKEND: "tcp://broker:5556"
      PUBSUB_XSUB_ENDPOINT: "tcp://proxy-pubsub:5557"
      SERVER_NAME: "server-python-1"
      REFERENCE_ENDPOINT: "tcp://referencia:5559"
    restart: unless-stopped
    volumes:
      - server_python_1_data:/app/data
    depends_on:
      - broker
      - proxy-pubsub
      - referencia
    networks:
      - rede-projeto

  server-python-2:
    build:
      context: ./python
      dockerfile: Dockerfile
    command: ["python", "server.py"]
    environment:
      BROKER_BACKEND: "tcp://broker:5556"
      PUBSUB_XSUB_ENDPOINT: "tcp://proxy-pubsub:5557"
      SERVER_NAME: "server-python-2"
      REFERENCE_ENDPOINT: "tcp://referencia:5559"
    restart: unless-stopped
    volumes:
      - server_python_2_data:/app/data
    depends_on:
      - broker
      - proxy-pubsub
      - referencia
