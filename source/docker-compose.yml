      REFERENCE_ENDPOINT: "tcp://referencia:5559"
    restart: unless-stopped
    volumes:
      - server_cpp_1_data:/app/data
    depends_on:
      - broker
      - proxy-pubsub
      - referencia
    networks:
      - rede-projeto

  server-cpp-2:
