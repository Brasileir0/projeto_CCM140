      REFERENCE_ENDPOINT: "tcp://referencia:5559"
    restart: unless-stopped
    volumes:
      - server_javascript_1_data:/app/data
    depends_on:
      - broker
      - proxy-pubsub
      - referencia
    networks:
      - rede-projeto

  server-javascript-2:
    build:
      context: ./javascript
      dockerfile: Dockerfile
    command: ["node", "server.js"]
    environment:
      BROKER_BACKEND: "tcp://broker:5556"
      PUBSUB_XSUB_ENDPOINT: "tcp://proxy-pubsub:5557"
      SERVER_NAME: "server-javascript-2"
      REFERENCE_ENDPOINT: "tcp://referencia:5559"
    restart: unless-stopped
    volumes:
      - server_javascript_2_data:/app/data
    depends_on:
      - broker
      - proxy-pubsub
      - referencia
    networks:
      - rede-projeto

  server-cpp-1:
    build:
      context: ./cpp
      dockerfile: Dockerfile
    command: ["./build/server"]
