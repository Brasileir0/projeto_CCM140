version: '3.8'

services:
  server:
    build:
      context: ./source/cpp
      dockerfile: Dockerfile
    container_name: server_cpp
    ports:
      - "5555:5555"
    command: ["./build/server"]

  client:
    build: 
      context: ./source/cpp
      dockerfile: Dockerfile
    container_name: client_cpp
    depends_on:
      - server
    command: ["./build/client"]