version: '3.8'

services:
  server-python-1:
    build:
      context: ./python
      dockerfile: Dockerfile
    command: ["python", "server.py"]
    restart: unless-stopped
    volumes:
      - server_python_1_data:/app/data
    networks:
      - rede-projeto

  server-python-2:
    build:
      context: ./python
      dockerfile: Dockerfile
    command: ["python", "server.py"]
    restart: unless-stopped
    volumes:
      - server_python_2_data:/app/data
    networks:
      - rede-projeto

  client-python-1:
    build:
      context: ./python
      dockerfile: Dockerfile
    command: ["python", "client.py"]
    environment:
      BOT_NAME: "PYTHON-1"
      SERVER_ENDPOINTS: "tcp://server-python-1:5555,tcp://server-python-2:5555,tcp://server-javascript-1:5555,tcp://server-javascript-2:5555,tcp://server-cpp-1:5555,tcp://server-cpp-2:5555"
    depends_on:
      - server-python-1
      - server-python-2
      - server-javascript-1
      - server-javascript-2
      - server-cpp-1
      - server-cpp-2
      - proxy-pubsub
    networks:
      - rede-projeto

  client-python-2:
    build:
      context: ./python
      dockerfile: Dockerfile
    command: ["python", "client.py"]
    environment:
      BOT_NAME: "PYTHON-2"
      SERVER_ENDPOINTS: "tcp://server-python-1:5555,tcp://server-python-2:5555,tcp://server-javascript-1:5555,tcp://server-javascript-2:5555,tcp://server-cpp-1:5555,tcp://server-cpp-2:5555"
    depends_on:
      - server-python-1
      - server-python-2
      - server-javascript-1
      - server-javascript-2
      - server-cpp-1
      - server-cpp-2
      - proxy-pubsub
    networks:
      - rede-projeto

  server-javascript-1:
    build:
      context: ./javascript
      dockerfile: Dockerfile
    command: ["node", "server.js"]
    restart: unless-stopped
    volumes:
      - server_javascript_1_data:/app/data
    depends_on:
      - proxy-pubsub
    networks:
      - rede-projeto

  server-javascript-2:
    build:
      context: ./javascript
      dockerfile: Dockerfile
    command: ["node", "server.js"]
    restart: unless-stopped
    volumes:
      - server_javascript_2_data:/app/data
    depends_on:
      - proxy-pubsub
    networks:
      - rede-projeto

  client-javascript-1:
    build:
      context: ./javascript
      dockerfile: Dockerfile
    command: ["node", "client.js"]
    environment:
      SERVER_ENDPOINTS: "tcp://server-javascript-1:5555"
      BOT_NAME: "JAVASCRIPT-1"
    depends_on:
      - server-javascript-1
      - server-javascript-2
      - proxy-pubsub
    networks:
      - rede-projeto

  client-javascript-2:
    build:
      context: ./javascript
      dockerfile: Dockerfile
    command: ["node", "client.js"]
    environment:
      SERVER_ENDPOINTS: "tcp://server-javascript-1:5555"
      BOT_NAME: "JAVASCRIPT-2"
    depends_on:
      - server-javascript-1
      - server-javascript-2
      - proxy-pubsub
    networks:
      - rede-projeto

  server-cpp-1:
    build:
      context: ./cpp
      dockerfile: Dockerfile
    command: ["./build/server"]
    restart: unless-stopped
    volumes:
      - server_cpp_1_data:/app/data
    networks:
      - rede-projeto

  server-cpp-2:
    build:
      context: ./cpp
      dockerfile: Dockerfile
    command: ["./build/server"]
    restart: unless-stopped
    volumes:
      - server_cpp_2_data:/app/data
    networks:
      - rede-projeto

  client-cpp-1:
    build:
      context: ./cpp
      dockerfile: Dockerfile
    command: ["./build/client"]
    environment:
      BOT_NAME: "CPP-1"
      SERVER_ENDPOINTS: "tcp://server-python-1:5555,tcp://server-python-2:5555,tcp://server-javascript-1:5555,tcp://server-javascript-2:5555,tcp://server-cpp-1:5555,tcp://server-cpp-2:5555"
    depends_on:
      - server-python-1
      - server-python-2
      - server-javascript-1
      - server-javascript-2
      - server-cpp-1
      - server-cpp-2
      - proxy-pubsub
    networks:
      - rede-projeto

  client-cpp-2:
    build:
      context: ./cpp
      dockerfile: Dockerfile
    command: ["./build/client"]
    environment:
      BOT_NAME: "CPP-2"
      SERVER_ENDPOINTS: "tcp://server-python-1:5555,tcp://server-python-2:5555,tcp://server-javascript-1:5555,tcp://server-javascript-2:5555,tcp://server-cpp-1:5555,tcp://server-cpp-2:5555"
    depends_on:
      - server-python-1
      - server-python-2
      - server-javascript-1
      - server-javascript-2
      - server-cpp-1
      - server-cpp-2
      - proxy-pubsub
    networks:
      - rede-projeto

  proxy-pubsub:
    build:
      context: ./javascript
      dockerfile: Dockerfile
    command: ["node", "proxy_pubsub.js"]
    ports:
      - "5557:5557"
      - "5558:5558"
    restart: unless-stopped
    networks:
      - rede-projeto

  proxy-pubsub-js:
    build:
      context: ./javascript
      dockerfile: Dockerfile
    command: ["node", "proxy_pubsub.js"]
    restart: unless-stopped
    networks:
      - rede-projeto

  proxy-pubsub-py:
    build:
      context: ./python
      dockerfile: Dockerfile
    command: ["python", "proxy_pubsub.py"]
    restart: unless-stopped
    networks:
      - rede-projeto

  proxy-pubsub-cpp:
    build:
      context: ./cpp
      dockerfile: Dockerfile
    command: ["./build/proxy_pubsub"]
    restart: unless-stopped
    networks:
      - rede-projeto

volumes:
  server_python_1_data:
  server_python_2_data:
  server_javascript_1_data:
  server_javascript_2_data:
  server_cpp_1_data:
  server_cpp_2_data:

networks:
  rede-projeto:
    driver: bridge