      context: ./python
      dockerfile: Dockerfile
    command: ["python", "client.py"]
    environment:
      BOT_NAME: "PYTHON-1"
      SERVER_ENDPOINTS: "tcp://broker:5555"
      PUBSUB_XPUB_ENDPOINT: "tcp://proxy-pubsub:5558"
    depends_on:
      - broker
