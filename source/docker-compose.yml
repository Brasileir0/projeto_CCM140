services:
  server-python:
    build:
      context: ./python
      dockerfile: Dockerfile
    command: ["python", "server.py"]

  client-python:
    build:
      context: ./python
      dockerfile: Dockerfile
    command: ["python", "client.py"]
    depends_on:
      - server-python

  server-javascript:
    build:
      context: ./javascript
      dockerfile: Dockerfile
    command: ["node", "server.js"]

  client-javascript:
    build:
      context: ./javascript
      dockerfile: Dockerfile
    command: ["node", "client.js"]
    depends_on:
      - server-javascript

  server-cpp:
    build:
      context: ./cpp
      dockerfile: Dockerfile
    command: ["./build/server"]

  client-cpp:
    build:
      context: ./cpp
      dockerfile: Dockerfile
    command: ["./build/client"]
    depends_on:
      - server-cpp
